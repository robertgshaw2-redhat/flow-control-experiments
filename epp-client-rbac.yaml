apiVersion: v1
kind: ServiceAccount
metadata:
  name: epp-client
  namespace: llm-test
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: epp-client-reader
  namespace: llm-test
rules:
- apiGroups: ["serving.kserve.io"]
  resources: ["llminferenceservices"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: epp-client-reader-binding
  namespace: llm-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: epp-client-reader
subjects:
- kind: ServiceAccount
  name: epp-client
  namespace: llm-test
